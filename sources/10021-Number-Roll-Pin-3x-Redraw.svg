<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="960" viewBox="0 0 1000 960" font-family="Arial, Helvetica, sans-serif">
<title>10.021 Number-roll pin (Zahlenrollenstift) – 3× reference sheet (derived 3× redraw; the scan is authoritative)</title>
<rect width="1000" height="960" fill="#ffffff"/>
<rect x="12" y="14" width="976" height="211" fill="#fff4c2" stroke="#b58900" stroke-width="1.5" rx="6"/>
<text x="26" y="36" font-size="15" font-weight="700" fill="#3d3000">DERIVED 3× REDRAW – NOT A FACTORY DRAWING</text>
<text x="26" y="53" font-size="12" fill="#3d3000">The original Contina scan of drawing 10.021-4 (revision 4, current; page 33 of the set) is authoritative. This sheet was redrawn from it.</text>
<text x="26" y="70" font-size="12" fill="#3d3000">Every value is the factory value × 3 (exact nominal), printed first, with the factory value in brackets. Tolerances are not scaled or adopted.</text>
<text x="26" y="87" font-size="12" fill="#3d3000">The printed callouts (Ø0.8 h8, 3.9, 1.1, 0.4 ±20 twice, max 0.4 r) are transcribed from the scan. The sheet was not overlaid on the scan.</text>
<text x="26" y="104" font-size="12" fill="#3d3000">Reading of the ground end: the scan does not describe it in words, so it is drawn as the scan's two views show: ground flat through the axis</text>
<text x="26" y="121" font-size="12" fill="#3d3000">in both directions, leaving a quarter-round section 0.4 mm (1.2 mm at 3×) wide each way, with the shoulder fillet at r0.4 (1.2 mm at 3×) on</text>
<text x="26" y="138" font-size="12" fill="#3d3000">both flats. The 1.1 callout is read as the straight flat, to where the fillet begins, so the ground region is 1.5 mm (4.5 mm at 3×) in all. A</text>
<text x="26" y="155" font-size="12" fill="#3d3000">FreeCAD model built from this reading was checked against the scan by the project's author (2026-10-06) and matched; this is the author's</text>
<text x="26" y="172" font-size="12" fill="#3d3000">comparison, not a printed statement on the sheet.</text>
<text x="26" y="189" font-size="12" fill="#3d3000">Derived, not printed on the scan: the 4.5 mm total ground length and the quarter-round end view.</text>
<text x="26" y="206" font-size="12" fill="#3d3000">Redraw © Chris Hurt, CC BY 4.0. Original drawing: Contina AG, public domain.</text>
<text x="26" y="245" font-size="17" font-weight="700" fill="#000">10.021 Number-roll pin (Zahlenrollenstift) – 3× reference sheet</text>
