<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1050" viewBox="0 0 700 1050" font-family="Arial, Helvetica, sans-serif">
<title>10.010 reversing nose, 3× redraw (derived; the scan is authoritative)</title>
<rect width="700" height="1050" fill="#ffffff"/>
<rect x="12" y="14" width="676" height="194" fill="#fff4c2" stroke="#b58900" stroke-width="1.5" rx="6"/>
<text x="26" y="36" font-size="15" font-weight="700" fill="#3d3000">DERIVED 3× REDRAW – NOT A FACTORY DRAWING</text>
<text x="26" y="53" font-size="12" fill="#3d3000">The original Contina scan of drawing 10.010-5 (revision 5, current; page 19 of the set) is</text>
<text x="26" y="70" font-size="12" fill="#3d3000">authoritative. This sheet was redrawn from it.</text>
<text x="26" y="87" font-size="12" fill="#3d3000">Every value is the factory value × 3 (exact nominal), printed first, with the factory value in</text>
<text x="26" y="104" font-size="12" fill="#3d3000">brackets. Tolerances are not scaled or adopted.</text>
<text x="26" y="121" font-size="12" fill="#3d3000">Dimensions were read from the scan and cross-checked by pixel measurement (agreement about 0.05 mm</text>
<text x="26" y="138" font-size="12" fill="#3d3000">at 1×); the sheet was not overlaid on the scan.</text>
<text x="26" y="155" font-size="12" fill="#3d3000">Derived, not printed on the scan: the common arc centre (3.0 mm left of the left edge, from 4.8 −</text>
<text x="26" y="172" font-size="12" fill="#3d3000">3.8) and the 1.2 mm slot centre spacing (6.6 − 5.4).</text>
<text x="26" y="189" font-size="12" fill="#3d3000">Redraw © Chris Hurt, CC BY 4.0. Original drawing: Contina AG, public domain.</text>
<text x="26" y="228" font-size="17" font-weight="700" fill="#000">10.010 Reversing nose (Umsteuerungsnase) – 3× reference sheet</text>
