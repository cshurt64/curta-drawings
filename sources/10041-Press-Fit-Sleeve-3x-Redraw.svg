<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="740" viewBox="0 0 1040 740" font-family="Arial, Helvetica, sans-serif">
<title>10.041 Press-fit sleeve (Presshülse) – 3× reference sheet (derived 3× redraw; the scan is authoritative)</title>
<rect width="1040" height="740" fill="#ffffff"/>
<rect x="12" y="14" width="1016" height="194" fill="#fff4c2" stroke="#b58900" stroke-width="1.5" rx="6"/>
<text x="26" y="36" font-size="15" font-weight="700" fill="#3d3000">DERIVED 3× REDRAW – NOT A FACTORY DRAWING</text>
<text x="26" y="53" font-size="12" fill="#3d3000">The original Contina scan of drawing 10.041-4 (revision 4, current; page 57 of the set) is authoritative. This sheet was redrawn from it.</text>
<text x="26" y="70" font-size="12" fill="#3d3000">Every value is the factory value × 3 (exact nominal), printed first, with the factory value in brackets. Tolerances are not scaled or adopted.</text>
<text x="26" y="87" font-size="12" fill="#3d3000">The three printed dimensions (Ø2.7 h11, Ø2.3 H8, 1.8) are direct callouts. The sheet was not overlaid on the scan.</text>
<text x="26" y="104" font-size="12" fill="#3d3000">Derived, not printed on the scan: the wall thickness 0.6 mm = (8.1 − 6.9) ÷ 2.</text>
<text x="26" y="121" font-size="12" fill="#3d3000">Added, not on the scan: the end view (two concentric circles) on the right, derived from the section's diameters. The factory sheet shows only the</text>
<text x="26" y="138" font-size="12" fill="#3d3000">half-section.</text>
<text x="26" y="155" font-size="12" fill="#3d3000">Not drawn: the 0.1 mm and 90° chamfer callouts that still appear on the scan. Revision 4 (change 274, 14.12.1949) deleted both, so they are not</text>
<text x="26" y="172" font-size="12" fill="#3d3000">current requirements.</text>
<text x="26" y="189" font-size="12" fill="#3d3000">Redraw © Chris Hurt, CC BY 4.0. Original drawing: Contina AG, public domain.</text>
<text x="26" y="228" font-size="17" font-weight="700" fill="#000">10.041 Press-fit sleeve (Presshülse) – 3× reference sheet</text>
