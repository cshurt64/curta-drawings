<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Curta Engineering Drawing Catalog</title>
<style>
:root { color-scheme: light dark; --bg:#f6f4ee; --panel:#fff; --text:#202124; --muted:#61656b; --line:#d9d5cb; --accent:#8b3f24; --current:#1f6b3a; }
@media (prefers-color-scheme: dark) { :root { --bg:#181816; --panel:#242421; --text:#efeee8; --muted:#b8b6ae; --line:#45443f; --accent:#f2a27f; --current:#83d49c; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui,sans-serif; }
header { position:sticky; top:0; z-index:5; padding:18px 22px 14px; background:color-mix(in srgb,var(--bg) 94%,transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
h1 { margin:0 0 12px; font-size:24px; }
.controls { display:grid; grid-template-columns:minmax(240px,1fr) repeat(2,minmax(150px,220px)); gap:10px; max-width:1100px; }
input,select { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:6px; background:var(--panel); color:var(--text); font:inherit; }
.summary { margin-top:9px; color:var(--muted); }
main { padding:18px 22px 40px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
.thumb { display:block; aspect-ratio:4/3; background:#d6d2c8; overflow:hidden; }
.thumb img { width:100%; height:100%; object-fit:contain; background:#e8e3d8; }
.meta { padding:12px 14px 14px; }
.part { font-size:19px; font-weight:650; color:var(--accent); }
.english { margin-top:3px; font-weight:600; }
.german { color:var(--muted); }
.details { display:flex; flex-wrap:wrap; gap:6px 12px; margin-top:9px; color:var(--muted); font-size:13px; }
.status-current { color:var(--current); font-weight:650; }
.status-superseded { color:var(--muted); }
.audit-badge { color:var(--accent); font-weight:650; }
.empty { padding:50px 10px; text-align:center; color:var(--muted); }
@media (max-width:720px) { .controls { grid-template-columns:1fr; } header { position:static; } }
</style>
</head>

const search=document.getElementById('search'),status=document.getElementById('status'),section=document.getElementById('section'),grid=document.getElementById('grid'),summary=document.getElementById('summary');

const compact=s=>norm(s).replaceAll(' ','');

function stateParams(page){const p=new URLSearchParams();if(page!=null)p.set('page',page);if(search.value)p.set('q',search.value);p.set('status',status.value);p.set('section',section.value);p.set('v',BUILD);return p;}
